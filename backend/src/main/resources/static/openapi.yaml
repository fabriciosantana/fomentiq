openapi: 3.1.0
info:
  title: Fomentiq Opportunity API
  version: 1.0.0
  description: >-
    Anonymous opportunity reads are available in all environments. Demo-only administrative
    session and curation operations are enabled only in the isolated manual-demo profile.
    Administrative operations require a session, ROLE_ADMIN, and CSRF on mutations. OIDC is
    required before administration can be exposed in production.
servers:
  - url: /
paths:
  /api/opportunities:
    get:
      operationId: listOpportunities
      summary: List, search, and filter opportunities
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CallStatus'}}
        - {name: deadlineFrom, in: query, schema: {type: string, format: date}}
        - {name: deadlineTo, in: query, schema: {type: string, format: date}}
        - {name: instrument, in: query, schema: {type: string, maxLength: 100}}
        - {name: region, in: query, schema: {type: string, maxLength: 120}}
        - {name: theme, in: query, schema: {type: string, maxLength: 120}}
        - {name: source, in: query, description: Source publisher code, schema: {type: string, enum: [FINEP, CNPQ]}}
        - {name: agency, in: query, description: Responsible agency acronym, schema: {type: string, enum: [FINEP, CNPq, CAPES]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Bounded opportunity page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content:
                        type: array
                        items: {$ref: '#/components/schemas/OpportunitySummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/opportunities/{callId}:
    get:
      operationId: getOpportunity
      summary: Get opportunity fields, states, and evidence
      parameters:
        - {$ref: '#/components/parameters/CallId'}
      responses:
        '200':
          description: Opportunity and latest call-version fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpportunityDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/opportunities/{callId}/versions:
    get:
      operationId: listCallVersions
      summary: List call snapshot history
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Paged call versions; document revisions remain separate documents
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/CallVersion'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/opportunities/{callId}/documents:
    get:
      operationId: listOpportunityDocuments
      summary: List documents and their latest-version summary
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Paged documents; storage keys are never returned
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/Document'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/opportunities/{callId}/documents/{documentId}/versions:
    get:
      operationId: listDocumentVersions
      summary: List preserved versions of a document
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Paged document versions without internal object-storage keys
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/DocumentVersion'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/opportunities/{callId}/evidence:
    get:
      operationId: listOpportunityEvidence
      summary: List evidence locators linked to extracted fields
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - name: field
          in: query
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/Page'}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Paged evidence; locator is the preserved document/source location
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/csrf:
    get:
      operationId: getAdminCsrf
      summary: Obtain the CSRF token for the isolated demo session
      responses:
        '200':
          description: CSRF header name and token; endpoint is available only in manual-demo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfBootstrap'}
        '403': {description: Administrative demo is disabled in this environment}
  /api/editorial/opportunities:
    get:
      operationId: listPublishedEditorialOpportunities
      summary: List published manually authored opportunities
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Published opportunities only
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/EditorialOpportunity'}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/editorial/opportunities/{id}:
    get:
      operationId: getPublishedEditorialOpportunity
      summary: Get a published editorial opportunity
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Published editorial content; never includes internal audit metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EditorialOpportunity'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/manual-opportunities:
    get:
      operationId: listManualEditorialOpportunities
      summary: List manual opportunities for the isolated administrator
      security: [{DemoSession: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Bounded administrative list
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageMetadata'}
                  - type: object
                    properties:
                      content: {type: array, items: {$ref: '#/components/schemas/AdminEditorialOpportunity'}}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
    post:
      operationId: createManualEditorialOpportunity
      summary: Create a manual opportunity draft
      security: [{DemoSession: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialContent'}
      responses:
        '200':
          description: Created draft with authenticated author and version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
  /api/admin/manual-opportunities/{id}:
    get:
      operationId: getManualEditorialOpportunity
      summary: Get current editable content for administration
      security: [{DemoSession: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Administrative editorial DTO including optimistic version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: saveManualEditorialOpportunity
      summary: Save editable content without changing the published snapshot
      security: [{DemoSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialSave'}
      responses:
        '200':
          description: Saved editable content and incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stale optimistic version}
  /api/admin/manual-opportunities/{id}/preview:
    get:
      operationId: previewManualEditorialOpportunity
      summary: Preview current editable content, including drafts
      security: [{DemoSession: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Preview DTO available only to the administrator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/manual-opportunities/{id}/publish:
    post:
      operationId: publishManualEditorialOpportunity
      summary: Publish the current editable content snapshot
      security: [{DemoSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialVersionRequest'}
      responses:
        '200':
          description: Current content snapshot published atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stale optimistic version}
  /api/admin/manual-opportunities/{id}/unpublish:
    post:
      operationId: unpublishManualEditorialOpportunity
      summary: Withdraw publication and keep editable content as draft
      security: [{DemoSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditorialVersionRequest'}
      responses:
        '200':
          description: Publication withdrawn atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialOpportunity'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stale optimistic version}
  /api/admin/login:
    post:
      operationId: loginAdminDemo
      summary: Create a Spring Security session for the demo administrator
      description: Form login. Requires CSRF header/token obtained from /api/admin/csrf.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '204': {description: Authenticated session created}
        '401': {description: Invalid environment-configured demo credentials}
        '403': {description: CSRF invalid or administrative demo disabled}
  /api/admin/logout:
    post:
      operationId: logoutAdminDemo
      summary: End the authenticated demo session
      security: [{DemoSession: []}]
      parameters: [{$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '204': {description: Session ended}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
  /api/admin/session:
    get:
      operationId: getAdminSession
      summary: Return the authenticated demo administrator identity
      security: [{DemoSession: []}]
      responses:
        '200':
          description: Authenticated principal name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
  /api/admin/opportunities:
    get:
      operationId: listOpportunitiesForReview
      summary: List a bounded queue of opportunities with fields needing review
      security: [{DemoSession: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Bounded review queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminQueue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
  /api/admin/opportunities/{callId}:
    get:
      operationId: getOpportunityForReview
      summary: Get protected review detail with safe evidence and publication projections
      security: [{DemoSession: []}]
      parameters: [{$ref: '#/components/parameters/CallId'}]
      responses:
        '200':
          description: DTO-only review projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpportunityDetail'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/opportunities/{callId}/documents/{documentId}/versions/{versionId}/content:
    get:
      operationId: readPreservedDocumentVersionForReview
      summary: Read a verified preserved document version in the isolated administrative session
      description: Only PDFs are returned inline. DOCX is returned as an attachment. Storage identifiers and endpoints are never included.
      security: [{DemoSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Verified original bytes for the exact opportunity/document/version
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Cache-Control: {schema: {type: string}}
          content:
            application/pdf: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Stored version exceeds the bounded read limit}
        '415': {description: Stored media type is not supported}
        '422': {description: Stored bytes fail integrity validation}
        '503': {description: Preserved document storage is unavailable}
  /api/admin/opportunities/{callId}/revisions:
    get:
      operationId: listHumanFieldRevisions
      summary: List immutable revision history for an opportunity field
      security: [{DemoSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {name: field, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Bounded revision-history page in chronological order; all revisions are reachable through pagination
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanFieldRevisionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: Administrative role is required}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createHumanFieldRevision
      summary: Save a typed revision as pending review
      security: [{DemoSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CallId'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateHumanFieldRevision'}
      responses:
        '200':
          description: Pending revision created with authenticated author
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanFieldRevision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/admin/revisions/{revisionId}/approve:
    post:
      operationId: approveHumanFieldRevision
      summary: Atomically publish a pending revision against its original baseline
      security: [{DemoSession: []}]
      parameters:
        - {name: revisionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevisionDecision'}
      responses:
        '200': {description: Revision approved and published}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Revision was already decided or its baseline is stale}
  /api/admin/revisions/{revisionId}/reject:
    post:
      operationId: rejectHumanFieldRevision
      summary: Reject a pending revision without changing public values
      security: [{DemoSession: []}]
      parameters:
        - {name: revisionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevisionDecision'}
      responses:
        '200': {description: Revision rejected}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Session is not authenticated}
        '403': {description: CSRF invalid or administrative role is missing}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Revision was already decided}
  /openapi.yaml:
    get:
      operationId: getOpenApiContract
      summary: Download this API contract
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    DemoSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CallId:
      name: callId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Header name returned by /api/admin/csrf
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid or out-of-bounds query parameter
    NotFound:
      description: Opportunity or document was not found
  schemas:
    CsrfBootstrap:
      type: object
      required: [headerName, token]
      properties:
        headerName: {type: string}
        token: {type: string}
    AdminSession:
      type: object
      required: [username]
      properties:
        username: {type: string}
    EditorialVersionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
    EditorialSave:
      type: object
      required: [expectedVersion, content]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        content: {$ref: '#/components/schemas/EditorialContent'}
    EditorialContent:
      type: object
      required: [title, institution, summary, status, sections]
      properties:
        title: {type: string, maxLength: 240, description: Required before publication; may be blank in a draft}
        institution: {type: string, maxLength: 240, description: Required before publication; may be blank in a draft}
        summary: {type: string, maxLength: 2000}
        deadline: {type: [string, 'null'], format: date}
        status: {type: string, maxLength: 40}
        officialUrl: {type: [string, 'null'], format: uri}
        sections: {type: array, maxItems: 40, items: {$ref: '#/components/schemas/EditorialSection'}}
    EditorialSection:
      type: object
      required: [title, position, fields]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        position: {type: integer, minimum: 0}
        fields: {type: array, items: {$ref: '#/components/schemas/EditorialField'}}
    EditorialField:
      type: object
      required: [name, type, value, position]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        type: {type: string, enum: [SHORT_TEXT, LONG_TEXT, DATE, CURRENCY, LINK, LIST]}
        value: {oneOf: [{type: string}, {type: array, items: {type: string}}, {type: 'null'}]}
        position: {type: integer, minimum: 0}
    EditorialOpportunity:
      allOf:
        - {$ref: '#/components/schemas/EditorialContent'}
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
    AdminEditorialOpportunity:
      allOf:
        - {$ref: '#/components/schemas/EditorialOpportunity'}
        - type: object
          required: [editorialState, rowVersion, createdBy, updatedBy, createdAt, updatedAt]
          properties:
            editorialState: {type: string, enum: [DRAFT, PUBLISHED]}
            rowVersion: {type: integer, minimum: 0}
            createdBy: {type: string}
            updatedBy: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    AdminQueue:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/AdminQueueItem'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        totalElements: {type: integer, minimum: 0}
    AdminQueueItem:
      type: object
      required: [callId, externalId, title, agencyName, agencyAcronym, publishers, agencies, reviewFieldCount, opportunityStatus]
      properties:
        callId: {type: string, format: uuid}
        externalId: {type: string}
        portalEntryId: {type: [string, 'null']}
        title: {type: string}
        agencyName: {type: string}
        agencyAcronym: {type: string}
        publishers: {type: array, items: {type: string}}
        agencies: {type: array, items: {type: string}}
        reviewFieldCount:
          type: integer
          minimum: 0
          description: Latest-version fields that need human review and have no approved human revision.
        opportunityStatus: {type: string, enum: [OPEN, UPCOMING, CLOSED, SUSPENDED, UNKNOWN]}
        deadline: {type: string, format: date, nullable: true}
    CreateHumanFieldRevision:
      type: object
      required: [fieldName, valueKind, justification, documentId, documentVersionId, absenceReviewComplete]
      properties:
        fieldName: {type: string}
        valueKind: {type: string, enum: [VALUE, CONFIRMED_ABSENCE]}
        value: {description: Typed value according to the allowlisted extraction field schema}
        justification: {type: string, minLength: 1, maxLength: 4000}
        documentId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        page: {type: [integer, 'null'], minimum: 1}
        section: {type: [string, 'null'], maxLength: 500}
        quote: {type: [string, 'null'], description: Required as a literal quotation only for VALUE revisions, maxLength: 8000}
        locator: {type: [object, 'null']}
        absenceReviewComplete: {type: boolean, description: Required true only for confirmed absence after full document review}
    RevisionDecision:
      type: object
      required: [rowVersion, reason]
      properties:
        rowVersion: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 4000}
    HumanFieldRevision:
      type: object
      required: [id, callId, fieldName, valueKind, justification, documentId, documentVersionId, status, createdBy, createdAt, rowVersion]
      properties:
        id: {type: string, format: uuid}
        callId: {type: string, format: uuid}
        fieldName: {type: string}
        valueKind: {type: string, enum: [VALUE, CONFIRMED_ABSENCE]}
        proposedValue: {description: Typed proposed value; null for confirmed absence}
        previousPublishedValue: {description: Previous effective value}
        previousRevisionId: {type: [string, 'null'], format: uuid}
        justification: {type: string}
        documentId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        page: {type: [integer, 'null']}
        section: {type: [string, 'null']}
        quote: {type: [string, 'null']}
        locator: {type: [object, 'null']}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        decidedBy: {type: [string, 'null']}
        decidedAt: {type: [string, 'null'], format: date-time}
        decisionReason: {type: [string, 'null']}
        rowVersion: {type: integer, minimum: 0}
    HumanFieldRevisionPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/HumanFieldRevision'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        totalElements: {type: integer, minimum: 0}
    PageMetadata:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    CallStatus:
      type: string
      enum: [OPEN, UPCOMING, CLOSED, SUSPENDED, UNKNOWN]
    OpportunitySummary:
      type: object
      required: [id, externalId, title, agency, status, sources, responsibleAgencies]
      properties:
        id: {type: string, format: uuid}
        externalId: {type: string, description: Stable source identity, such as historical Finep ID 751}
        portalEntryId: {type: [string, 'null'], description: Current portal entry, such as 751092}
        title: {type: string}
        agency: {$ref: '#/components/schemas/Agency'}
        program: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/CallStatus'}
        deadline: {type: [string, 'null'], format: date}
        instrumentType: {type: [string, 'null']}
        sources:
          type: array
          items: {$ref: '#/components/schemas/SourcePublisher'}
        responsibleAgencies:
          type: array
          items: {$ref: '#/components/schemas/ResponsibleAgency'}
    Agency:
      type: object
      required: [name, acronym]
      properties:
        name: {type: string}
        acronym: {type: string}
    SourcePublisher:
      type: object
      required: [code, name]
      properties:
        code: {type: string, enum: [FINEP, CNPQ]}
        name: {type: string}
    ResponsibleAgency:
      type: object
      required: [name, acronym, primary]
      properties:
        name: {type: string}
        acronym: {type: string}
        primary: {type: boolean}
    OpportunityDetail:
      type: object
      required: [opportunity, fields]
      properties:
        opportunity: {$ref: '#/components/schemas/OpportunitySummary'}
        summary: {type: [string, 'null']}
        officialUrl: {type: [string, 'null'], format: uri}
        currentCallVersion: {type: [integer, 'null']}
        fields: {type: array, items: {$ref: '#/components/schemas/ExtractedField'}}
    ExtractedField:
      type: object
      required: [name, value, rawValue, validationStatus, createdAt, evidence, publicationSource, publishedRevisionId, originalValue, confirmedHumanAbsence, publicationReference]
      properties:
        name: {type: string}
        value: {description: Structured normalized value; null for MISSING, array of alternatives for CONFLICT}
        rawValue: {type: [string, 'null']}
        validationStatus: {type: string, enum: [EXTRACTED, VALIDATED, CONFLICT, MISSING]}
        createdAt: {type: string, format: date-time}
        evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        publicationSource: {type: string, enum: [EXTRACTION, HUMAN]}
        publishedRevisionId: {type: [string, 'null'], format: uuid}
        originalValue: {description: Original normalized extraction, preserved when a human value is published}
        confirmedHumanAbsence: {type: boolean}
        publicationReference: {oneOf: [{$ref: '#/components/schemas/PublicationReference'}, {type: 'null'}]}
    PublicationReference:
      type: object
      required: [documentId, documentVersionId, sourceUrl, page, section, quote]
      properties:
        documentId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        sourceUrl: {type: [string, 'null'], format: uri}
        page: {type: [integer, 'null']}
        section: {type: [string, 'null']}
        quote: {type: [string, 'null']}
    Evidence:
      type: object
      required: [id, extractedFieldId, fieldName, sourceUrl, locator]
      properties:
        id: {type: string, format: uuid}
        extractedFieldId: {type: string, format: uuid}
        fieldName: {type: string}
        documentVersionId: {type: [string, 'null'], format: uuid}
        sourceUrl: {type: [string, 'null'], format: uri}
        page: {type: [integer, 'null']}
        section: {type: [string, 'null']}
        quote: {type: [string, 'null']}
        locator: {type: object}
    CallVersion:
      type: object
      required: [id, versionNumber, contentHash, detectedAt]
      properties:
        id: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        detectedAt: {type: string, format: date-time}
        supersedesVersionId: {type: [string, 'null'], format: uuid}
    Document:
      type: object
      required: [id, externalId, type, title, sourceUrl, versionCount]
      properties:
        id: {type: string, format: uuid}
        externalId: {type: string}
        type: {type: string, enum: [NOTICE, ANNEX, FAQ, AMENDMENT, RESULT_PRELIMINARY, RESULT_FINAL, OTHER]}
        title: {type: string}
        sourceUrl: {type: [string, 'null'], format: uri}
        versionCount: {type: integer, minimum: 0}
        latestDownloadedAt: {type: [string, 'null'], format: date-time}
    DocumentVersion:
      type: object
      required: [id, contentHash, mediaType, sourceUrl, downloadedAt]
      properties:
        id: {type: string, format: uuid}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        mediaType: {type: string}
        sourceUrl: {type: [string, 'null'], format: uri}
        downloadedAt: {type: string, format: date-time}
