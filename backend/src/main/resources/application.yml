spring:
  application:
    name: fomentiq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fomentiq}
    username: ${DATABASE_USERNAME:fomentiq}
    password: ${DATABASE_PASSWORD:fomentiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

fomentiq:
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:fomentiq}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  finep:
    canonical-url: ${FINEP_CANONICAL_URL:https://www.finep.gov.br/e/chamada-publica/222684/751092}
