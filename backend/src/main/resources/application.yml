spring:
  application:
    name: fomentiq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fomentiq}
    username: ${DATABASE_USERNAME:fomentiq}
    password: ${DATABASE_PASSWORD:fomentiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

fomentiq:
  extraction:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-6-luna}
    reasoning-effort: ${EXTRACTION_REASONING_EFFORT:low}
    timeout-seconds: ${EXTRACTION_TIMEOUT_SECONDS:60}
    max-retries: ${EXTRACTION_MAX_RETRIES:0}
    max-input-tokens: ${EXTRACTION_MAX_INPUT_TOKENS:64000}
    max-output-tokens: ${EXTRACTION_MAX_OUTPUT_TOKENS:12000}
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:fomentiq}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  finep:
    canonical-url: ${FINEP_CANONICAL_URL:https://www.finep.gov.br/e/chamada-publica/222684/751092}
